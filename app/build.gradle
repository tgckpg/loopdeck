plugins { id 'com.android.application' }

android {
    namespace 'net.astropenguin.loopdeck'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'net.astropenguin.loopdeck'
        minSdk 26
        // This private, sideloaded player targets the M11S's Android 10.
        targetSdk 29
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging true } }
}
